name: Map Technical Feedback
description: Share feedback about something that works, but feels off, unclear or unbalanced.
labels:
  - Feedback
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your feedback! Please write in **English** and [search existing issues](https://github.com/KDany/steam-workshop/issues?q=is%3Aissue) (including closed ones) first.

  - type: dropdown
    id: game
    attributes:
      label: Game
      description: Which game does this feedback relate to?
      options:
        - Counter-Strike 2
      default: 0
    validations:
      required: true

  - type: dropdown
    id: map_name
    attributes:
      label: Map name
      description: Which map is this about? If it is not listed, choose "Other" and write the map name in the feedback.
      options:
        - Dust II Long
        - Other
    validations:
      required: true

  - type: textarea
    id: area
    attributes:
      label: Area or feature
      description: Which part of the map are you referring to?
      placeholder: "Example: Mid to B connector lighting and visibility."
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Location (getpos)
      description: |
        Optional: stand at the spot, open the developer console and type `getpos`, then paste the output here.
      placeholder: "Example: setpos 123.45 -678.90 64.03;setang 2.50 90.00 0.00"
      render: text
    validations:
      required: false

  - type: textarea
    id: details
    attributes:
      label: Technical feedback
      description: Describe the problem and why it impacts gameplay.
      placeholder: "Example: The lighting contrast in this map location makes enemies hard to spot at longer distances, which creates unbalanced gameplay."
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: If you have a suggestion, describe the change or recommendation you would like to see.
      placeholder: "Example: Increase visibility in this corridor with brighter lighting or cleaner contrast."

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or video
      description: Optional, but helpful if you have visual evidence.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues, including closed ones.
          required: true
